name: Fetch activity compendium

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_compendium.py"
      - ".github/workflows/fetch-compendium.yml"

permissions:
  contents: write

jobs:
  compendium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - name: Download and parse 2024 Adult Compendium
        run: python3 scripts/fetch_compendium.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/compendium_2024.json data/compendium_2024_summary.txt
          git diff --cached --quiet || git commit -m "Update 2024 Adult Compendium extract [skip ci]"
          git pull --rebase origin main
          git push
