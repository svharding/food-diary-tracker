name: Fetch food data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_off_canada.py"
      - ".github/workflows/fetch-data.yml"

permissions:
  contents: write

jobs:
  open-food-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and filter Open Food Facts (Canada)
        run: python3 scripts/fetch_off_canada.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/off_canada.json data/off_canada_summary.txt
          git diff --cached --quiet || git commit -m "Update Open Food Facts Canada extract [skip ci]"
          git pull --rebase origin main
          git push
